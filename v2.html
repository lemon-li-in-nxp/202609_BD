<!DOCTYPE html>
<html lang="zh-Hant">

<meta charset="UTF-8">

<title>Pixel Perth Quest</title>

<style>

@font-face{

    font-family:"Cubic11";

    src:url(
        "fonts/Cubic_11.ttf"
    );

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Cubic11","Microsoft JhengHei",sans-serif;

    height:100vh;

    background:
    linear-gradient(
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.5)
    ),
    url("perth.jpg");

    background-size:cover;
    background-position:center;
}

.screen{

    min-height:100vh;

    display:flex;
    flex-direction:column;

    padding:0;
}

.logo{

    text-align:center;

    margin-top:20px;
}

.logo h1{
    color:white;
    font-size:48px;
    font-weight:900;
}

.logo p{

    color:#ffd166;

    margin-top:5px;
}

.hero{

    display:flex;

    justify-content:center;

    align-items:center;

    margin:20px 0;
}

.panel{

    width:100%;
    max-width:500px;

    margin:auto;

    background:
    rgba(255,255,255,.92);

    border-radius:20px;

    padding:24px;

    backdrop-filter:blur(10px);

    box-shadow:
    0 10px 30px rgba(0,0,0,.25);
}

input{

    width:100%;

    padding:18px;

    font-size:18px;

    border:none;

    border-radius:12px;

    background:#eef4f8;

    margin-bottom:10px;
}

.main-btn{

    width:100%;

    padding:18px;

    font-size:20px;

    border:none;

    border-radius:12px;

    background:#ffb703;

    font-size:18px;

    font-weight:bold;

    margin-bottom:10px;

    cursor:pointer;
}

.sub-btn{

    width:100%;

    padding:15px;

    border:2px solid #457b9d;

    border-radius:12px;

    background:white;

    color:#457b9d;

    font-weight:bold;

    cursor:pointer;
}

.footer{

    text-align:center;

    margin-top:12px;

    color:#888;
}

#createPage{
    display:none;
}
#createPage .logo{
    margin-top:20px;
}

#createPage .panel{
    margin-top:auto;
}
.selector{

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:#eef4f8;

    border-radius:16px;

    padding:16px;

    margin-bottom:12px;
}

.arrow{

    width:60px;

    text-align:center;

    cursor:pointer;

    font-weight:bold;

    font-size:28px;
}

.value{

    flex:1;

    text-align:center;
}

.back-btn{

    background:#ddd;
}

#characterCanvas{

    width:150px;
    height:150px;

    image-rendering:pixelated;

    background:
    rgba(255,255,255,.15);

    border-radius:20px;

    padding:10px;
}

function drawCharacter(canvasId){

    const canvas =
    document.getElementById(canvasId);

    if(!canvas) return;

    const ctx =
    canvas.getContext("2d");

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    const body =
    new Image();

    const hair =
    new Image();

    const cloth =
    new Image();

    const wing =
    new Image();

    body.src =
    bodyFiles[bodyIndex];

    hair.src =
    hairFiles[hairIndex];

    cloth.src =
    clothesFiles[clothesIndex];

if(wingFiles[wingIndex]){
    wing.src = wingFiles[wingIndex];
}

    Promise.all([

        new Promise(r=>body.onload=r),
        new Promise(r=>hair.onload=r),
        new Promise(r=>cloth.onload=r),
        new Promise(r=>{

    if(wingFiles[wingIndex]){
        wing.onload = r;
    }
    else{
        r();
    }

})

    ]).then(()=>{

const size = 64;

let frameX;
let frameY;

if(
    canvasId === "gameCanvas"
    &&
    isMoving
){

    frameX =
    currentFrame * 64;

    frameY =
    direction * 64;

}
else{

    frameX =
    STAND_X * 64;

    frameY =
    STAND_Y * 64;

}

if(wingFiles[wingIndex]){

    ctx.drawImage(
        wing,
        frameX,frameY,size,size,
        0,0,size,size
    );

}

        ctx.drawImage(
            body,
            frameX,frameY,size,size,
            0,0,size,size
        );

        ctx.drawImage(
            cloth,
            frameX,frameY,size,size,
            0,0,size,size
        );

        ctx.drawImage(
            hair,
            frameX,frameY,size,size,
            0,0,size,size
        );

    });

}

function drawNpc(){

    const canvas =
    document.getElementById(
        "npcCanvas"
    );

    if(!canvas){
        return;
    }

    const ctx =
    canvas.getContext("2d");

    const img =
    new Image();

    img.src = npcImage;

    img.onload = function(){

        ctx.clearRect(
            0,
            0,
            64,
            64
        );

        ctx.drawImage(

            img,

            128,
            128,

            128,
            128,

            0,
            0,

            64,
            64

        );

    };

}

function updateCharacter(){

    drawCharacter("characterCanvas");
    drawCharacter("previewCanvas");
    drawCharacter("gameCanvas");
    checkNpcDistance();
    drawNpc();

}

function changeBody(step){

    bodyIndex += step;

    if(bodyIndex < 0)
        bodyIndex =
        bodyFiles.length - 1;

    if(bodyIndex >= bodyFiles.length)
        bodyIndex = 0;

    document.getElementById(
    "bodyText"
    ).innerText =
    "Body " + (bodyIndex+1);

    updateCharacter();
}

function changeHair(step){

    hairIndex += step;

    if(hairIndex < 0)
        hairIndex =
        hairFiles.length - 1;

    if(hairIndex >= hairFiles.length)
        hairIndex = 0;

    document.getElementById(
    "hairText"
    ).innerText =
    "Hair " + (hairIndex+1);

    updateCharacter();
}

function changeClothes(step){

    clothesIndex += step;

    if(clothesIndex < 0)
        clothesIndex =

    if(clothesIndex >= clothesFiles.length)
        clothesIndex = 0;

    document.getElementById(
    "clothesText"
    ).innerText =
    "Clothes " + (clothesIndex+1);

    updateCharacter();
}

function changeWings(step){

    wingIndex += step;

    if(wingIndex < 0)
        wingIndex =
        wingFiles.length - 1;

    if(wingIndex >= wingFiles.length)
        wingIndex = 0;

if(wingIndex===0){

    document.getElementById(
    "wingsText"
    ).innerText = "no wings";

}
else{

    document.getElementById(
    "wingsText"
    ).innerText =
    "wings " + wingIndex;

}

    updateCharacter();
}

function checkNpcDistance(){

    const npcX = 65;
    const npcY = 65;

    const distance = Math.sqrt(
        (playerX - npcX) ** 2 +
        (playerY - npcY) ** 2
    );

    const icon =
    document.getElementById(
        "npcTalkIcon"
    );

    if(distance < 13){

        icon.style.display =
        "block";

    }
    else{

        icon.style.display =
        "none";

    }

}

function showCreatePage(){

    document.getElementById(
    "loginPage").style.display="none";

    document.getElementById(
    "createPage").style.display="flex";

    updateCharacter();
}

function talkToNpc(){

    isMoving = false;

    const npcX = 65;
    const npcY = 65;

    const dx = npcX - playerX;
    const dy = npcY - playerY;

    if(
        Math.abs(dx) >
        Math.abs(dy)
    ){

        if(dx > 0){
            direction = 41;
        }
        else{
            direction = 39;
        }

    }
    else{

        if(dy > 0){
            direction = 40;
        }
        else{
            direction = 38;
        }

    }

    currentFrame = 0;

    drawCharacter(
        "gameCanvas"
    );
    welcomeMessages = [

        "哞，我是 N.K. Mou。",

        "你問我Yukon的test pattern？喔不是，你說教你如何得到生日點數？",

        "點數主要可以透過「拍照任務」及「每日任務」來累積。",

        "「拍照任務」可以去上方的城鎮接取，「每日任務」則是去左邊的教堂接取。",

        "畫面右上角的map可以帶你去其他小島，等級到達後才會解鎖，島上會有寶箱等著你。",

        "聽懂了就開始行動吧，哞～",
    ];

    showWelcomeDialog();

}

function showWelcomeDialog(){

    dialogPage = 0;

    const dialog =
    document.getElementById(
        "welcomeDialog"
    );

    const text =
    document.getElementById(
        "welcomeDialogText"
    );

    text.innerHTML =
    welcomeMessages[0];
isDialogOpen = true;
    dialog.style.display =
    "block";

    dialog.onclick =
    function(){

        dialogPage++;

if(
    dialogPage >=
    welcomeMessages.length
){

    isDialogOpen = false;

    dialog.style.display =
    "none";

    return;
}

        text.innerHTML =
        welcomeMessages[
            dialogPage
        ];

    };

}

function isBlocked(
    x,
    y
){

    for(
        const collision
        of collisions
    ){

        if(

            x >= collision.x

            &&

            x <=
            collision.x +
            collision.width

            &&

            y >= collision.y

            &&

            y <=
            collision.y +
            collision.height

        ){

            return true;

        }

    }

    return false;

}

function movePlayer(event){

    if(editMode){
        return;
    }

    if(isDialogOpen){
        return;
    }

    const area =
    document.getElementById(
        "gameArea"
    );

    const rect =
    area.getBoundingClientRect();

    targetX =
    (
        (event.clientX - rect.left)
        / rect.width
    ) * 100;

    targetY =
    (
        (event.clientY - rect.top)
        / rect.height
    ) * 100;

    if(targetX < 5){
        targetX = 5;
    }

    if(targetX > 90){
        targetX = 90;
    }

    if(targetY < 10){
        targetY = 10;
    }

    if(targetY > 85){
        targetY = 85;
    }

    isMoving = true;

}

function createCollisionBox(
    collision
){

    const layer =
    document.getElementById(
        "collisionLayer"
    );

    const box =
    document.createElement(
        "div"
    );

    box.style.position =
    "absolute";

    box.style.left =
    collision.x + "%";

    box.style.top =
    collision.y + "%";

    box.style.width =
    collision.width + "%";

    box.style.height =
    collision.height + "%";

    box.style.background =
    "rgba(255,0,0,0.3)";

    box.style.border =
    "2px solid red";

    const deleteBtn =
    document.createElement(
        "div"
    );

    deleteBtn.innerText =
    "✕";

    deleteBtn.style.position =
    "absolute";

    deleteBtn.style.right =
    "-10px";

    deleteBtn.style.top =
    "-10px";

    deleteBtn.style.width =
    "20px";

    deleteBtn.style.height =
    "20px";

    deleteBtn.style.background =
    "#ff0000";

    deleteBtn.style.color =
    "white";

    deleteBtn.style.borderRadius =
    "50%";

    deleteBtn.style.display =
    "flex";

    deleteBtn.style.alignItems =
    "center";

    deleteBtn.style.justifyContent =
    "center";

    deleteBtn.style.cursor =
    "pointer";

    deleteBtn.style.fontWeight =
    "bold";

    deleteBtn.style.fontSize =
    "12px";

    deleteBtn.style.zIndex =
    "9999";

    deleteBtn.addEventListener(
        "click",
        function(e){

            e.stopPropagation();

            const index =
            collisions.indexOf(
                collision
            );

            if(index > -1){

                collisions.splice(
                    index,
                    1
                );

            }

            box.remove();

            console.log(
                collisions
            );

        }
    );

    box.appendChild(
        deleteBtn
    );

    layer.appendChild(
        box
    );

}

function loadCollisionData(
